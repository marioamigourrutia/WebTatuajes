name: One-off Next security upgrade

on:
  push:
    branches: [design/neonink-faithful-v2]
    paths:
      - .github/workflows/upgrade-next-security.yml

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: design/neonink-faithful-v2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Upgrade Next.js security release
        run: npm install --save-exact next@16.3.6 eslint-config-next@16.3.6

      - name: Commit generated manifests
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            echo "No dependency changes produced."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "security: upgrade Next.js to 16.3.6"
          git push origin HEAD:design/neonink-faithful-v2
